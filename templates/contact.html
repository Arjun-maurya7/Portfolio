<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Arjun Maurya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.6s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in-section {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .fade-in-section.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white transition-colors duration-300">
    <!-- Header -->
    <header class="fixed top-0 w-full bg-white/90 dark:bg-gray-900/90 backdrop-blur-md z-50 border-b border-gray-200 dark:border-gray-700">
        <nav class="container mx-auto px-6 py-3">
            <div class="flex justify-between items-center">
                <!-- Logo - Left Side -->
                <div class="flex items-center">
                    <a href="/" class="nav-link">
                        <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center hover:bg-purple-700 transition-colors cursor-pointer">
                            <span class="text-white font-bold text-lg">A</span>
                        </div>
                    </a>
                </div>
                
                <!-- Right Side - Close Button -->
                <div class="flex items-center space-x-4">
                    <a href="/" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="pt-24 min-h-screen flex items-center justify-center">
        <div class="container mx-auto px-6 max-w-2xl">
            <div class="fade-in-section text-center">
                <!-- Avatar -->
                <div class="mb-8">
                    <div class="w-24 h-24 mx-auto rounded-full overflow-hidden border-4 border-purple-200 dark:border-purple-800 shadow-lg">
                        <img src="{{ url_for('static', filename='images/My_image.png') }}" 
                             alt="Arjun Maurya" 
                             class="w-full h-full object-cover object-center">
                    </div>
                </div>

                <!-- Heading -->
                <h1 class="text-3xl md:text-4xl font-bold mb-8 text-gray-900 dark:text-white leading-relaxed">
                    Thanks for taking the time to reach out.<br>
                    <span class="text-purple-600 dark:text-purple-400">How can I help you today?</span>
                </h1>

                <!-- Contact Form -->
                <form class="space-y-6 mt-12">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Name</label>
                            <input type="text" id="name" name="name" 
                                   class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors" 
                                   required>
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Email</label>
                            <input type="email" id="email" name="email" 
                                   class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors" 
                                   required>
                        </div>
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Message</label>
                        <textarea id="message" name="message" rows="6" 
                                  class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-colors resize-none" 
                                  required></textarea>
                    </div>
                    <button type="submit" 
                            class="w-full bg-purple-600 text-white px-8 py-3 rounded-lg hover:bg-purple-700 transition-colors font-medium">
                        Send Message
                    </button>
                </form>

                <!-- Contact Info -->
                <div class="mt-12 pt-8 border-t border-gray-200 dark:border-gray-700">
                    <p class="text-gray-600 dark:text-gray-400 mb-4 font-bold text-xl">Or reach out directly</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="mailto:arjunmaurya2026@gmail.com" 
                           class="text-purple-600 dark:text-purple-400 hover:text-purple-700 dark:hover:text-purple-300 transition-colors">
                            arjunmaurya2026@gmail.com
                        </a>
                        <span class="hidden sm:inline text-gray-400">•</span>
                        <a href="https://www.linkedin.com/in/maurya-arjun/" target="_blank" 
                           class="text-purple-600 dark:text-purple-400 hover:text-purple-700 dark:hover:text-purple-300 transition-colors" m-5>
                            LinkedIn
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        // Fade in animation
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in-section').forEach(el => {
            observer.observe(el);
        });
    </script>
</body>
</html>
